# This bundle's rows. `dsh.bundle.patch` points here, so the profile loader
# composes them over whatever the profile already had.
#
# The startup row comes first: it claims the app argument (`login`/`logout`/
# `status`) and publishes `wechatStartup`, which later rows read through
# `!!js`. An argument no row claims is ignored in silence, which is why this
# row has to exist for `dsh <profile> login` to do anything at all.
- insert:
    - id: channel-wechat-startup
      name: dsh-channel-wechat/startup
    - id: channel-wechat
      name: dsh-channel-wechat
